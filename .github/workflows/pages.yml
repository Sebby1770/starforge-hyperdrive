name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# A push landing while a deploy is in flight should supersede it rather than
# race it, so only the newest commit reaches the live site.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install binaryen
        run: sudo apt-get update && sudo apt-get install -y binaryen

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      # Vite is configured with a relative base, so the same bundle works at a
      # project subpath without a build-time URL.
      - name: Build the instrument
        working-directory: web
        run: npm run build

      - name: Verify the deployed engine
        working-directory: web
        run: npm run verify:wasm

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
